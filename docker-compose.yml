services:
  be2:
    image: ghcr.io/giakiet05/test-homeserver-be2:latest
    pull_policy: always
    container_name: test-be2
    restart: unless-stopped
    environment:
      - PORT=4002
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4002/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  be1:
    image: ghcr.io/giakiet05/test-homeserver-be1:latest
    pull_policy: always
    container_name: test-be1
    restart: unless-stopped
    depends_on:
      be2:
        condition: service_healthy
    environment:
      - PORT=4001
      - BE2_URL=http://be2:4002
      - NODE_ENV=production
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:4001/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

  fe:
    image: ghcr.io/giakiet05/test-homeserver-fe:latest
    pull_policy: always
    container_name: test-fe
    restart: unless-stopped
    depends_on:
      be1:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
