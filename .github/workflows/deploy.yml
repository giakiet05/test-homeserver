name: Build & Deploy Microservices to Homeserver

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-deploy:
    name: Build, Deploy & Verify Exact Commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. Build & Push BE2 (Core Service)
      - name: Build and push BE2 Image
        uses: docker/build-push-action@v5
        with:
          context: ./be2
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/test-homeserver-be2:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Build & Push BE1 (Gateway) with COMMIT_SHA
      - name: Build and push BE1 Image
        uses: docker/build-push-action@v5
        with:
          context: ./be1
          push: true
          build-args: |
            COMMIT_SHA=${{ github.sha }}
            APP_VERSION=6.0.0
          tags: ghcr.io/${{ github.repository_owner }}/test-homeserver-be1:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3. Build & Push FE (Frontend)
      - name: Build and push FE Image
        uses: docker/build-push-action@v5
        with:
          context: ./fe
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/test-homeserver-fe:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4. Trigger Coolify Deploy Webhook
      - name: Trigger Deployment on Coolify
        run: |
          echo "🚀 Triggering Coolify Deploy Webhook..."
          RESPONSE=$(curl -k -s -X POST "${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}" \
               -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
               -H "Content-Type: application/json")
          echo "Coolify Response: $RESPONSE"

      # 5. Smart Polling: Verify Exact Commit SHA on Live Server
      - name: Polling & Verifying Exact Commit SHA
        run: |
          EXPECTED_SHA="${{ github.sha }}"
          TARGET_URL="https://test.giakiet.io.vn/api/status"
          MAX_RETRIES=20
          RETRY_COUNT=0

          echo "🎯 Expected Commit SHA on Live Server: $EXPECTED_SHA"
          echo "⏳ Waiting for Coolify to pull images & complete Zero-Downtime switch..."

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            # Fetch live JSON response
            RESPONSE=$(curl -k -s "$TARGET_URL" || echo "{}")
            LIVE_SHA=$(echo "$RESPONSE" | grep -o '"commitSha":"[^"]*' | cut -d'"' -f4 || echo "unknown")

            echo "[$((RETRY_COUNT+1))/$MAX_RETRIES] Live Server Commit SHA: '$LIVE_SHA'"

            if [ "$LIVE_SHA" = "$EXPECTED_SHA" ]; then
              echo "=================================================="
              echo "🎉 SUCCESS! New version with exact commit SHA is LIVE!"
              echo "=================================================="
              echo "Full Payload:"
              echo "$RESPONSE"
              exit 0
            fi

            echo "Server is still running previous container. Retrying in 5s..."
            sleep 5
            RETRY_COUNT=$((RETRY_COUNT+1))
          done

          echo "❌ Timed out waiting for commit $EXPECTED_SHA to go live."
          exit 1
