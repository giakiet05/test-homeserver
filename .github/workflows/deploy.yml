name: Build & Deploy Microservices to Homeserver

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-deploy:
    name: Build, Deploy & Verify Live Health
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. Build & Push BE2 (Core Service)
      - name: Build and push BE2 Image
        uses: docker/build-push-action@v5
        with:
          context: ./be2
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/test-homeserver-be2:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Build & Push BE1 (Gateway)
      - name: Build and push BE1 Image
        uses: docker/build-push-action@v5
        with:
          context: ./be1
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/test-homeserver-be1:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3. Build & Push FE (Frontend)
      - name: Build and push FE Image
        uses: docker/build-push-action@v5
        with:
          context: ./fe
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/test-homeserver-fe:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4. Trigger Coolify Deploy Webhook
      - name: Trigger Deployment on Coolify
        run: |
          echo "🚀 Triggering Coolify Deploy Webhook..."
          RESPONSE=$(curl -k -s -X POST "${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}" \
               -H "Authorization: Bearer ${{ secrets.COOLIFY_API_TOKEN }}" \
               -H "Content-Type: application/json")
          echo "Coolify Response: $RESPONSE"

      # 5. Polling & Verifying Live Health Status
      - name: Polling & Verifying Live Deployment
        run: |
          echo "⏳ Waiting for Homeserver to pull images & launch healthy containers..."
          sleep 5
          MAX_RETRIES=15
          RETRY_COUNT=0
          TARGET_URL="https://test.giakiet.io.vn/api/status"

          while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
            HTTP_STATUS=$(curl -k -s -o /dev/null -w "%{http_code}" "$TARGET_URL" || echo "000")
            if [ "$HTTP_STATUS" -eq 200 ]; then
              echo "✅ Live endpoint responded with HTTP 200 OK!"
              echo "Payload:"
              curl -k -s "$TARGET_URL"
              exit 0
            fi
            echo "Attempt $((RETRY_COUNT+1))/$MAX_RETRIES: Status $HTTP_STATUS. Waiting 5s for containers to settle..."
            sleep 5
            RETRY_COUNT=$((RETRY_COUNT+1))
          done

          echo "❌ Live health check failed after $MAX_RETRIES attempts."
          exit 1
