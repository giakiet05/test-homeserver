name: Build & Deploy Microservices to Homeserver

on:
  push:
    branches: [ "main", "master" ]

jobs:
  build-and-push:
    name: Build Multi-Service Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 1. Build & Push BE2 (Core Service)
      - name: Build and push BE2 Image
        uses: docker/build-push-action@v5
        with:
          context: ./be2
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/test-homeserver-be2:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 2. Build & Push BE1 (Gateway)
      - name: Build and push BE1 Image
        uses: docker/build-push-action@v5
        with:
          context: ./be1
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/test-homeserver-be1:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 3. Build & Push FE (Frontend)
      - name: Build and push FE Image
        uses: docker/build-push-action@v5
        with:
          context: ./fe
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/test-homeserver-fe:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4. Trigger Coolify Deploy Webhook
      - name: Trigger Deployment on Coolify
        if: env.COOLIFY_WEBHOOK != ''
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}
        run: |
          echo "🚀 Triggering Coolify webhook..."
          curl -f -X GET "${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}" || curl -f -X POST "${{ secrets.COOLIFY_DEPLOY_WEBHOOK }}"
          echo "✅ Deployment triggered successfully!"
